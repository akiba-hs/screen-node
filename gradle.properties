org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Значения по умолчанию, которые зашиваются в APK: адрес сервера (хост:порт HTTP) и токен
# проектора. На проекторе адрес и токен задаёт install.sh через adb (токен в сборку релиза не
# зашивается — релизы публичны). Открытый ключ подписи обновлений и versionCode сборка релиза
# (.github/workflows/release.yml) передаёт через -P.
screennode.server=projector.lan:8080
screennode.token=
# Открытый ключ подписи обновлений (base64 DER); пусто — служба пульта не обновляет приложения.
screennode.updateKey=
